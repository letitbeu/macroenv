<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Daily Market Overview</title>
<style>
  :root{--blue:#0577b5;--deep:#0a4c73;--text:#1c1f23;--muted:#6b7280;--line:#1f2937;--green:#cfead6;--green2:#90d2a5;--red:#f7d5d8;--red2:#f19da5;--white:#fff;--bg:#f4f6f8}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
  .page{max-width:1440px;margin:20px auto;padding:26px 30px 18px;background:#fff;box-shadow:0 6px 30px rgba(0,0,0,.08)}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:14px}
  h1{margin:0;font-size:34px;letter-spacing:.02em}.sub{font-size:12px;color:var(--muted);text-align:right;line-height:1.6}
  .read{border-left:5px solid var(--blue);background:#f1f7fb;padding:12px 16px;margin:8px 0 18px}.read strong{font-size:17px}.read ul{margin:8px 0 0 18px;padding:0;columns:2;column-gap:34px}.read li{margin:5px 0;break-inside:avoid;font-size:13px;line-height:1.5}
  .grid{display:grid;grid-template-columns:1fr 1.08fr;gap:24px;align-items:start}.section{margin-bottom:11px}.section-title{font-weight:700;font-size:17px;margin:0 0 3px;padding:4px 2px;border-bottom:2px solid #4b5563}
  table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}.hdr th{background:var(--blue);color:#fff;font-weight:700;padding:5px 6px;border-right:1px solid rgba(255,255,255,.25)}
  th:first-child,td:first-child{text-align:left;width:32%} th:not(:first-child),td:not(:first-child){text-align:right} td{padding:4px 6px;border-bottom:1px solid #d7dde2;height:27px} .latest{font-variant-numeric:tabular-nums}.na{color:#9ca3af}
  .pos1{background:var(--green)}.pos2{background:var(--green2)}.neg1{background:var(--red)}.neg2{background:var(--red2)}
  .footer{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:11px;border-top:2px solid #374151;padding-top:8px;margin-top:10px}.brand{font-weight:700;color:#4b5563}
  .error{padding:14px;background:#fff1f2;color:#991b1b;border:1px solid #fecdd3}.loading{padding:30px;text-align:center;color:var(--muted)}
  @media(max-width:900px){.page{margin:0;padding:14px}.grid{grid-template-columns:1fr}.read ul{columns:1}h1{font-size:26px}.top{align-items:flex-start}.sub{text-align:left}}
  @media print{body{background:#fff}.page{box-shadow:none;margin:0;max-width:none;padding:12px}.read{break-inside:avoid}.section{break-inside:avoid}}
</style>
</head>
<body>
<div class="page" id="capture">
  <div class="top"><div><h1>1. 市场概览</h1></div><div class="sub" id="stamp">正在获取市场数据…</div></div>
  <div id="read" class="read"><strong>Daily Macro Read</strong><div class="loading">加载中…</div></div>
  <div id="app" class="loading">正在更新各资产数据…</div>
  <div class="footer"><div>Source: FRED, Yahoo Finance · 自动按最新可用交易日更新</div><div class="brand">DAILY MARKET OVERVIEW</div></div>
</div>
<script>
const sectionOrderLeft=['US Treasury','Curvature','Credit Spread','Macro Rates','Commodity & Crypto'];
const sectionOrderRight=['Equity','Currency'];

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmt(row,key){const v=row[key];if(v==null||!Number.isFinite(v))return '<span class="na">—</span>';const d=row.decimals??1;if(key==='latest')return Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});const n=Math.abs(v)<0.05?0:v;return `${n<0?'('+(Math.abs(n)).toFixed(1)+')':n.toFixed(1)}`}
function cls(v){if(v==null||!Number.isFinite(v)||Math.abs(v)<0.05)return '';const a=Math.abs(v);if(v>0)return a>=5?'pos2':'pos1';return a>=5?'neg2':'neg1'}
function unitHead(group){return ['US Treasury','Curvature','Credit Spread','Macro Rates'].includes(group)?['Latest','5Day','MTD','YTD']:['Latest','5Day (%)','MTD %','YTD %']}
function section(group,rows){const [a,b,c,d]=unitHead(group);return `<div class="section"><div class="section-title">${esc(group)}</div><table><thead class="hdr"><tr><th>${group==='US Treasury'?'Tenor':group==='Curvature'?'UST':'Asset'}</th><th>${a}</th><th>${b}</th><th>${c}</th><th>${d}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="latest">${fmt(r,'latest')}</td><td class="${cls(r.d5)}">${fmt(r,'d5')}</td><td class="${cls(r.mtd)}">${fmt(r,'mtd')}</td><td class="${cls(r.ytd)}">${fmt(r,'ytd')}</td></tr>`).join('')}</tbody></table></div>`}
function groupRows(rows,groups){return groups.map(g=>section(g,rows.filter(r=>r.group===g))).join('')}
async function main(){
 try{
  const r=await fetch('/api/market'); const j=await r.json(); if(!r.ok)throw new Error(j.error||'API error');
  document.getElementById('stamp').innerHTML=`Generated: ${new Date(j.generatedAt).toLocaleString()}<br>Latest dates may differ by market / holiday`;
  document.getElementById('read').innerHTML=`<strong>${esc(j.read?.headline||'Daily Macro Read')}</strong><ul>${(j.read?.bullets||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  document.getElementById('app').className='grid';
  document.getElementById('app').innerHTML=`<div>${groupRows(j.rows,sectionOrderLeft)}</div><div>${groupRows(j.rows,sectionOrderRight)}</div>`;
 }catch(e){document.getElementById('app').className='error';document.getElementById('app').textContent='数据更新失败：'+e.message;}
}
main();
</script>
</body>
</html>
