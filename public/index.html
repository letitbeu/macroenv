<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Market Overview</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:#202020;font-family:Arial,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif}
  .sheet{width:1120px;margin:18px auto 30px;padding:0 4px;background:#fff}
  .title{font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;font-size:35px;font-weight:700;letter-spacing:.02em;margin:8px 0 44px 0}
  .date{font-weight:700;font-size:14px;margin:0 0 5px 12px}
  .columns{display:grid;grid-template-columns:510px 536px;column-gap:28px;align-items:start}
  .section{margin:0 0 7px 0}.section-name{font-size:16px;font-weight:700;line-height:20px;margin:0 0 1px 3px}
  table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;line-height:1.15} col.c1{width:43%} col.cn{width:19%}
  thead th{height:26px;padding:4px 7px 3px;background:#0877b7;color:#fff;font-size:13px;font-weight:700;border-right:1px solid rgba(255,255,255,.35);white-space:nowrap}
  thead th:first-child{text-align:left} thead th:not(:first-child){text-align:right}
  tbody td{height:24px;padding:3px 7px;border-bottom:1px solid #d8d8d8;white-space:nowrap;overflow:hidden;text-overflow:clip}
  tbody tr:last-child td{border-bottom:2px solid #353535} tbody td:first-child{text-align:left} tbody td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
  .latest{background:#fff}.p1{background:#e3f1e6}.p2{background:#b9dfc2}.p3{background:#70c68b}.n1{background:#fae7e8}.n2{background:#f7c4c7}.n3{background:#ef777f}.z{background:#f7f7f7}.na{color:#aaa}
  .source-link{color:inherit;text-decoration:none;border-bottom:1px dotted #9aa0a6;cursor:pointer}.source-link:hover{color:#0877b7;border-bottom-color:#0877b7}
  .source{font-size:11px;margin:6px 0 0 4px;color:#2f2f2f}.status{font-size:12px;color:#888;margin:8px 0 0 12px}
  .analysis{margin:28px 0 0 4px;border-top:2px solid #353535;padding-top:10px;display:none}
  .analysis-title{font-size:18px;font-weight:700;margin:0 0 10px}
  .analysis-row{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #d8d8d8;font-size:13px;line-height:1.65}
  .analysis-row:last-child{border-bottom:0}.horizon{font-weight:700}.tone{font-weight:700}
  @media(max-width:1160px){.sheet{transform-origin:top left;transform:scale(calc((100vw - 12px)/1120));margin-left:6px;margin-right:0}}
  @media print{.sheet{margin:0 auto}.analysis{break-inside:avoid}.source-link{border-bottom:0}}
</style>
</head>
<body>
<div class="sheet">
  <div id="title" class="title">1. 市场概览</div>
  <div id="date" class="date"></div>
  <div id="status" class="status">Loading...</div>
  <div class="columns" id="grid" style="display:none"><div id="left"></div><div id="right"></div></div>
  <div id="source" class="source" style="display:none"></div>
  <div id="analysis" class="analysis">
    <div id="analysisTitle" class="analysis-title"></div>
    <div id="analysisBody"></div>
  </div>
</div>
<script>
const isEn = location.pathname === '/en' || location.pathname.startsWith('/en/');
const T = {
  zh:{
    title:'1. 市场概览',loading:'正在更新市场数据…',source:'数据来源：FRED、Yahoo Finance、日本财务省｜北京时间每日早10点更新' ,
    analysisTitle:'自动解读',sourceTip:'点击打开原始数据源',
    groups:{'US Treasury':'美国国债','Curvature':'收益率曲线','Credit Spread':'信用利差','DM Rates':'发达市场利率','Commodity':'大宗商品','Equity':'股票','Currency':'外汇'},
    first:{'US Treasury':'期限','Curvature':'美债','Credit Spread':'','DM Rates':'','Commodity':'','Equity':'','Currency':''},
    headsRate:['最新 (%)','5日','月初至今','年初至今'],headsBps:['最新 (bps)','5日','月初至今','年初至今'],headsPct:['最新','5日 (%)','月初至今 %','年初至今 %'],
    horizons:['短期（1–2周）','中期（1–3个月）','长期（6–12个月）'],
    tones:{bull:'偏多',neutral:'中性',bear:'偏空'},
    names:{'3m':'3个月','1y':'1年','2y':'2年','5y':'5年','10y':'10年','30y':'30年','2y10y':'2年-10年','5y30y':'5年-30年','10y30y':'10年-30年','US IG':'美国投资级','US HY':'美国高收益','UK 10y':'英国10年','DE 10y':'德国10年','Italy 10y':'意大利10年','Japan 20y':'日本20年','Aussie 10y':'澳大利亚10年','Gold':'黄金','Silver':'白银','Copper':'铜','Brent':'布伦特原油','WTI':'WTI原油','N.Gas':'天然气','Dow Jones':'道琼斯','S&P 500':'标普500','NASDAQ':'纳斯达克','Russell 2k':'罗素2000','PHLX Semi':'费城半导体','VIX':'VIX','Euro Stox':'欧洲斯托克','UK':'英国','France':'法国','Germany':'德国','Swiss':'瑞士','Nikkei':'日经225','Hang Seng':'恒生指数','CSI 300':'沪深300','Taiwan':'台湾加权','Singapore':'新加坡','India':'印度','Australia':'澳大利亚','USD Index':'美元指数','EUR':'欧元','GBP':'英镑','CHF':'瑞郎','JPY':'日元','AUD':'澳元','HKD':'港元','THB':'泰铢','MYR':'马来西亚林吉特','INR':'印度卢比','IDR':'印尼盾','KRW':'韩元','CNH':'离岸人民币'}
  },
  en:{
    title:'1. Market Overview',loading:'Updating market data…',source:'Source: FRED, Yahoo Finance, Ministry of Finance Japan | Updated daily at 10:00 Beijing Time (UTC+8)' ,analysisTitle:'Automated Interpretation',sourceTip:'Open original data source',
    groups:{'US Treasury':'US Treasury','Curvature':'Curvature','Credit Spread':'Credit Spread','DM Rates':'DM Rates','Commodity':'Commodity','Equity':'Equity','Currency':'Currency'},
    first:{'US Treasury':'Tenor','Curvature':'UST','Credit Spread':'','DM Rates':'','Commodity':'','Equity':'','Currency':''},
    headsRate:['Latest (%)','5Day','MTD','YTD'],headsBps:['Latest (bps)','5Day','MTD','YTD'],headsPct:['Latest','5Day (%)','MTD %','YTD %'],
    horizons:['Short term (1–2 weeks)','Medium term (1–3 months)','Long term (6–12 months)'],
    tones:{bull:'Bullish',neutral:'Neutral',bear:'Bearish'},names:{}
  }
};
const L=T[isEn?'en':'zh']; document.documentElement.lang=isEn?'en':'zh-CN'; document.getElementById('title').textContent=L.title; document.getElementById('status').textContent=L.loading;
function label(name){return isEn?name:(L.names[name]||name)}
function displayDate(){const d=new Date();return isEn?`${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`:`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`}
document.getElementById('date').textContent=displayDate();
function heat(v,unit){if(v==null||!Number.isFinite(v))return '';const a=Math.abs(v);if(a<.00001)return'z';let t1,t2;if(unit==='bps'){t1=5;t2=15}else{t1=.75;t2=3}if(v>0)return a>=t2?'p3':a>=t1?'p2':'p1';return a>=t2?'n3':a>=t1?'n2':'n1'}
function paren(v,d=1){if(v==null||!Number.isFinite(v))return'<span class="na">—</span>';const x=Math.abs(v)<.05?0:v;return x<0?`(${Math.abs(x).toFixed(d)})`:x.toFixed(d)}
function latest(r){if(r.latest==null||!Number.isFinite(r.latest))return'<span class="na">—</span>';const d=r.decimals??1;return Number(r.latest).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
function heads(group){if(group==='US Treasury')return L.headsRate;if(group==='Curvature'||group==='Credit Spread')return L.headsBps;if(group==='DM Rates')return L.headsRate;return L.headsPct}
function sourceUrl(r){
  if(r.group==='Curvature'){
    const pairs={'2y10y':['DGS2','DGS10'],'5y30y':['DGS5','DGS30'],'10y30y':['DGS10','DGS30']};
    const p=pairs[r.name]; if(p)return `https://fred.stlouisfed.org/graph/fredgraph.csv?id=${p[0]},${p[1]}`;
  }
  if(r.group==='DM Rates'&&r.name==='Japan 20y')return 'https://www.mof.go.jp/english/policy/jgbs/reference/interest_rate/historical/jgbcme_all.csv';
  if(r.id)return `https://fred.stlouisfed.org/series/${encodeURIComponent(r.id)}`;
  if(r.symbol)return `https://finance.yahoo.com/quote/${encodeURIComponent(r.symbol)}`;
  return null;
}
function sourceAnchor(r){const u=sourceUrl(r),txt=label(r.name);return u?`<a class="source-link" href="${u}" target="_blank" rel="noopener noreferrer" title="${L.sourceTip}">${txt}</a>`:txt}
function section(group,rows){const h=heads(group),unit=['US Treasury','Curvature','Credit Spread','DM Rates'].includes(group)?'bps':'pct';return `<div class="section"><div class="section-name">${L.groups[group]}</div><table><colgroup><col class="c1"><col class="cn"><col class="cn"><col class="cn"><col class="cn"></colgroup><thead><tr><th>${L.first[group]||''}</th><th>${h[0]}</th><th>${h[1]}</th><th>${h[2]}</th><th>${h[3]}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${sourceAnchor(r)}</td><td class="latest">${latest(r)}</td><td class="${heat(r.d5,unit)}">${paren(r.d5,unit==='bps'?0:1)}</td><td class="${heat(r.mtd,unit)}">${paren(r.mtd,unit==='bps'?0:1)}</td><td class="${heat(r.ytd,unit)}">${paren(r.ytd,unit==='bps'?0:1)}</td></tr>`).join('')}</tbody></table></div>`}
function build(rows,groups){return groups.map(g=>section(g,rows.filter(r=>r.group===g))).join('')}
function getRow(rows,group,name){return rows.find(r=>r.group===group&&r.name===name)||{}}
function n(v,d=1){return Number.isFinite(v)?Number(v).toFixed(d):'—'}
function sign(v,d=1){if(!Number.isFinite(v))return'—';return `${v>0?'+':''}${Number(v).toFixed(d)}`}
function classify(score){return score>=1.4?'bull':score<=-1.4?'bear':'neutral'}
function scorePeriod(rows,key){
  const sp=getRow(rows,'Equity','S&P 500')[key], btc=getRow(rows,'Commodity','BTC')[key], vix=getRow(rows,'Equity','VIX')[key],
        y10=getRow(rows,'US Treasury','10y')[key], hy=getRow(rows,'Credit Spread','US HY')[key], brent=getRow(rows,'Commodity','Brent')[key];
  let s=0;
  if(Number.isFinite(sp))s+=sp>0?1:-1;
  if(Number.isFinite(btc))s+=btc>0?.6:-.6;
  if(Number.isFinite(vix))s+=vix<0?.7:-.7;
  if(Number.isFinite(y10))s+=y10<0?.7:-.7;
  if(Number.isFinite(hy))s+=hy<0?1:-1;
  if(Number.isFinite(brent)&&Math.abs(brent)>=3)s+=brent<0?.5:-.5;
  return classify(s);
}
function interpretation(rows){
  const y10=getRow(rows,'US Treasury','10y'), hy=getRow(rows,'Credit Spread','US HY'), brent=getRow(rows,'Commodity','Brent'),
        sp=getRow(rows,'Equity','S&P 500'), btc=getRow(rows,'Commodity','BTC'), vix=getRow(rows,'Equity','VIX'),
        usd=getRow(rows,'Currency','USD Index'), curve=getRow(rows,'Curvature','2y10y');
  const st=scorePeriod(rows,'d5'), mt=scorePeriod(rows,'mtd');
  let ltScore=0;
  if(Number.isFinite(sp.ytd))ltScore+=sp.ytd>0?1:-1;
  if(Number.isFinite(btc.ytd))ltScore+=btc.ytd>0?.6:-.6;
  if(Number.isFinite(hy.ytd))ltScore+=hy.ytd<0?1:-1;
  if(Number.isFinite(curve.latest))ltScore+=curve.latest>0?.4:-.4;
  if(Number.isFinite(y10.latest))ltScore+=y10.latest<4.5?.5:y10.latest>5?-.5:0;
  const lt=classify(ltScore);
  const credit = Number.isFinite(hy.latest) ? (hy.latest<300?'low':hy.latest<400?'mid':'high') : 'na';

  if(!isEn){
    const creditText=credit==='low'?'信用利差仍低，当前更偏估值/利率冲击而非系统性信用风险':credit==='mid'?'信用利差已进入中等压力区，需要警惕风险从估值向基本面传导':credit==='high'?'信用利差处于高压区，系统性风险权重明显上升':'信用数据暂不完整';
    const s1=`过去5个交易日：10年美债收益率变动 ${sign(y10.d5,0)}bp，高收益债利差变动 ${sign(hy.d5,0)}bp，Brent ${sign(brent.d5)}%，标普500 ${sign(sp.d5)}%，BTC ${sign(btc.d5)}%。${creditText}。`;
    const s2=`本月至今：10年美债 ${sign(y10.mtd,0)}bp，高收益债利差 ${sign(hy.mtd,0)}bp，Brent ${sign(brent.mtd)}%，美元指数 ${sign(usd.mtd)}%，VIX ${sign(vix.mtd)}%。若利率和油价继续上行且信用利差同步走阔，中期风险会由“估值压缩”升级为“信用收紧”。`;
    const s3=`年初至今：标普500 ${sign(sp.ytd)}%，BTC ${sign(btc.ytd)}%，高收益债利差 ${sign(hy.ytd,0)}bp；当前2年-10年美债曲线为 ${n(curve.latest,0)}bp。长期核心仍是盈利增长能否覆盖高利率带来的估值压力，信用利差是否持续稳定是最重要的确认项。`;
    return [[L.horizons[0],L.tones[st],s1],[L.horizons[1],L.tones[mt],s2],[L.horizons[2],L.tones[lt],s3]];
  }
  const creditText=credit==='low'?'Credit spreads remain low, pointing more to valuation/rate pressure than systemic credit stress':credit==='mid'?'Credit spreads are in a moderate-stress zone, raising the risk of transmission into fundamentals':credit==='high'?'Credit spreads are in a high-stress zone and systemic risk is materially higher':'Credit data are incomplete';
  const s1=`Over 5 trading days: US 10Y ${sign(y10.d5,0)}bp, HY spread ${sign(hy.d5,0)}bp, Brent ${sign(brent.d5)}%, S&P 500 ${sign(sp.d5)}%, BTC ${sign(btc.d5)}%. ${creditText}.`;
  const s2=`MTD: US 10Y ${sign(y10.mtd,0)}bp, HY spread ${sign(hy.mtd,0)}bp, Brent ${sign(brent.mtd)}%, DXY ${sign(usd.mtd)}%, VIX ${sign(vix.mtd)}%. If rates and oil keep rising while credit spreads widen, medium-term pressure shifts from valuation compression to credit tightening.`;
  const s3=`YTD: S&P 500 ${sign(sp.ytd)}%, BTC ${sign(btc.ytd)}%, HY spread ${sign(hy.ytd,0)}bp; the 2Y-10Y Treasury curve is ${n(curve.latest,0)}bp. Long-term direction depends on whether earnings growth can offset the valuation drag from high rates, with credit spreads as the key confirmation signal.`;
  return [[L.horizons[0],L.tones[st],s1],[L.horizons[1],L.tones[mt],s2],[L.horizons[2],L.tones[lt],s3]];
}
function renderInterpretation(rows){
  const data=interpretation(rows);
  document.getElementById('analysisTitle').textContent=L.analysisTitle;
  document.getElementById('analysisBody').innerHTML=data.map(x=>`<div class="analysis-row"><div class="horizon">${x[0]}<br><span class="tone">${x[1]}</span></div><div>${x[2]}</div></div>`).join('');
  document.getElementById('analysis').style.display='block';
}
(async()=>{try{
  const resp=await fetch('/data/market.json',{cache:'no-store'}),data=await resp.json();if(!resp.ok)throw new Error(data.error||'API error');
  document.getElementById('left').innerHTML=build(data.rows,['US Treasury','Curvature','Credit Spread','DM Rates','Commodity']);
  document.getElementById('right').innerHTML=build(data.rows,['Equity','Currency']);
  document.getElementById('status').style.display='none';document.getElementById('grid').style.display='grid';
  document.getElementById('source').textContent=L.source;document.getElementById('source').style.display='block';
  renderInterpretation(data.rows);
}catch(e){document.getElementById('status').textContent=(isEn?'Data update failed: ':'数据更新失败：')+e.message}})();
</script>
</body>
</html>
