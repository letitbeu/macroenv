name: Force professional macro v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-professional-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make root dashboard single-source and professional
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          css = r'''
/* PROFESSIONAL_V3 */
.sheet{position:relative}
.lang-switch{position:absolute;right:4px;top:4px;z-index:20;display:flex;gap:6px;align-items:center;font:700 12px Arial,sans-serif;background:#fff;border:1px solid #cfd6dc;border-radius:5px;padding:5px 8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.lang-switch a{color:#0877b7;text-decoration:none}.lang-switch a:hover{text-decoration:underline}
.analysis{margin-top:26px!important}
.analysis-title{font-size:18px!important;margin-bottom:10px!important}
.macro-regime{padding:10px 12px;background:#f5f8fa;border-left:4px solid #0877b7;font-size:13px;line-height:1.7;margin-bottom:10px}
.macro-regime strong{font-size:14px}
.macro-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 10px}
.macro-card{border:1px solid #d9dee3;padding:8px 9px;min-height:78px;background:#fff}
.macro-card small{display:block;color:#666;margin-bottom:3px}.macro-card strong{display:block;font-size:14px;margin-bottom:4px}.macro-card span{display:block;font-size:11px;line-height:1.45;color:#555}
.macro-cross{margin:6px 0 4px;padding:8px 10px;background:#fafafa;border:1px solid #e2e2e2;font-size:12px;line-height:1.65}
.macro-cross b{font-size:12px}
.macro-row{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:11px 0;border-bottom:1px solid #d8d8d8;font-size:13px;line-height:1.72}
.macro-row:last-child{border-bottom:0}.macro-h{font-weight:700}.macro-tone{display:block;margin-top:2px;font-size:12px}.macro-primary{display:block;margin-top:3px;color:#666;font-size:11px;font-weight:400}
@media(max-width:1228px){.macro-cards{grid-template-columns:repeat(4,1fr)}}
'''

          js = r'''
// PROFESSIONAL_V3
function renderProfessionalV3(rows){
  const R=(g,n)=>getRow(rows,g,n)||{};
  const V=(g,n,k)=>{const x=R(g,n)[k];return Number.isFinite(x)?x:null};
  const fmt=(x,d=1,suffix='')=>Number.isFinite(x)?`${x>0?'+':''}${Number(x).toFixed(d)}${suffix}`:'—';
  const latest=(g,n,d=0,suffix='')=>{const x=R(g,n).latest;return Number.isFinite(x)?`${Number(x).toFixed(d)}${suffix}`:'—'};
  const clamp=x=>Math.max(-2,Math.min(2,x));

  function driver(key){
    const y10=V('US Treasury','10y',key),hy=V('Credit Spread','US HY',key),usd=V('Currency','USD Index',key),vix=V('Equity','VIX',key);
    const sp=V('Equity','S&P 500',key),rut=V('Equity','Russell 2k',key),semi=V('Equity','PHLX Semi',key),cu=V('Commodity','Copper',key),br=V('Commodity','Brent',key);
    let liq=0,growth=0,infl=0;
    if(y10!=null) liq += y10>=5?-1:y10<=-5?1:0;
    if(hy!=null) liq += hy>=5?-1:hy<=-5?1:0;
    if(usd!=null) liq += usd>=.5?-.5:usd<=-.5?.5:0;
    if(vix!=null) liq += vix>=5?-.4:vix<=-5?.4:0;
    if(cu!=null) growth += cu>=1?1:cu<=-1?-1:0;
    if(rut!=null) growth += rut>0?.4:rut<0?-.4:0;
    if(sp!=null) growth += sp>.2?.3:sp<-.2?-.3:0;
    if(semi!=null) growth += semi>=1?.5:semi<=-1?-.5:0;
    if(br!=null) infl += br>=7?1.5:br>=3?1:br<=-5?-.8:br<=-3?-.5:0;
    return {liq:clamp(liq),growth:clamp(growth),infl:clamp(infl)};
  }
  function creditState(){const x=R('Credit Spread','US HY').latest;return !Number.isFinite(x)?'watch':x<300?'healthy':x<400?'watch':'stress'}
  function labelState(kind,x){
    if(kind==='liq') return x<=-.75?(isEn?'Tightening':'收紧'):x>=.75?(isEn?'Supportive':'宽松/支持'):(isEn?'Neutral':'中性');
    if(kind==='growth') return x>=.75?(isEn?'Resilient':'偏强'):x<=-.75?(isEn?'Soft':'偏弱'):(isEn?'Neutral':'中性');
    return x>=.75?(isEn?'Elevated':'偏热'):x<=-.5?(isEn?'Contained':'温和'):(isEn?'Neutral':'中性');
  }
  function primary(d,c){
    const w={liq:Math.abs(d.liq)*1.1,growth:Math.abs(d.growth)*.9,infl:Math.abs(d.infl)*.9,credit:c==='stress'?1.6:c==='watch'?.5:.2};
    return Object.entries(w).sort((a,b)=>b[1]-a[1])[0][0];
  }
  function tone(d,c){
    const s=1.05*d.liq+.8*d.growth-.9*d.infl+(c==='healthy'?.3:c==='stress'?-1.5:-.3);
    return s<=-.5?'bear':s>=.8?'bull':'neutral';
  }
  function toneText(t){return isEn?(t==='bear'?'Cautious':t==='bull'?'Constructive':'Neutral'):(t==='bear'?'偏谨慎':t==='bull'?'偏乐观':'中性')}
  function primaryText(p){
    const zh={liq:'流动性/金融条件',growth:'增长/盈利',infl:'通胀/商品',credit:'信用'};
    const en={liq:'Liquidity / Financial Conditions',growth:'Growth / Earnings',infl:'Inflation / Commodities',credit:'Credit'};
    return (isEn?en:zh)[p];
  }
  const d5=driver('d5'),mtd=driver('mtd'),c=creditState();
  const st=tone(d5,c),mt=tone(mtd,c),pST=primary(d5,c),pMT=primary(mtd,c);

  let ltScore=0;
  const spy=V('Equity','S&P 500','ytd'),semiy=V('Equity','PHLX Semi','ytd'),cuy=V('Commodity','Copper','ytd'),hyY=V('Credit Spread','US HY','ytd'),y10Y=V('US Treasury','10y','ytd'),brY=V('Commodity','Brent','ytd'),btcY=V('Commodity','BTC','ytd');
  if(spy!=null)ltScore+=spy>0?1:-1;if(semiy!=null)ltScore+=semiy>0?.7:-.7;if(cuy!=null)ltScore+=cuy>0?.6:-.6;if(hyY!=null)ltScore+=hyY<0?.7:-.7;if(y10Y!=null)ltScore+=y10Y>50?-.8:y10Y<0?.4:0;if(brY!=null)ltScore+=brY>30?-.8:0;if(btcY!=null)ltScore+=btcY>0?.3:-.3;
  const lt=ltScore>=1.5?'bull':ltScore<=-.5?'bear':'neutral';
  const creditTxt=c==='healthy'?(isEn?'Healthy':'健康'):c==='watch'?(isEn?'Watch':'观察'):(isEn?'Stressed':'承压');

  const cards=[
    [isEn?'Liquidity / Financial Conditions':'流动性/金融条件',labelState('liq',d5.liq),`${isEn?'US 10Y':'10年美债'} ${fmt(V('US Treasury','10y','d5'),0,'bp')} · HY ${fmt(V('Credit Spread','US HY','d5'),0,'bp')} · DXY ${fmt(V('Currency','USD Index','d5'),1,'%')} · VIX ${fmt(V('Equity','VIX','d5'),1,'%')}`],
    [isEn?'Growth / Earnings':'增长/盈利',labelState('growth',d5.growth),`${isEn?'Copper':'铜'} ${fmt(V('Commodity','Copper','d5'),1,'%')} · ${isEn?'PHLX Semis':'费城半导体'} ${fmt(V('Equity','PHLX Semi','d5'),1,'%')} · Russell ${fmt(V('Equity','Russell 2k','d5'),1,'%')}`],
    [isEn?'Inflation / Commodities':'通胀/商品',labelState('infl',d5.infl),`Brent ${fmt(V('Commodity','Brent','d5'),1,'%')} · WTI ${fmt(V('Commodity','WTI','d5'),1,'%')}`],
    [isEn?'Credit':'信用',creditTxt,`US HY ${latest('Credit Spread','US HY',0,'bp')} · US IG ${latest('Credit Spread','US IG',0,'bp')}`]
  ];

  const cross=[];
  if((V('US Treasury','10y','d5')??0)>3 && (V('Currency','USD Index','d5')??0)<0) cross.push(isEn?'US yields are rising while the dollar is falling: the move looks more like term-premium/supply/reflation pressure than a pure Fed-hawkish growth signal.':'美债收益率上行而美元走弱：这更像期限溢价、供给或再通胀压力，而不是单一的“美联储更鹰/美国增长更强”。');
  if(((V('Equity','PHLX Semi','d5')??0)-(V('Equity','S&P 500','d5')??0))>2) cross.push(isEn?'Semiconductors are materially outperforming the broad market, indicating an earnings-led structural equity bid rather than broad risk-on.':'半导体显著跑赢大盘，说明权益更偏盈利确定性驱动的结构行情，而不是全面 Risk-on。');
  if((V('Commodity','BTC','d5')??0)<0 && (V('Equity','PHLX Semi','d5')??0)>0) cross.push(isEn?'BTC is lagging while semiconductors rise, which does not confirm a broad liquidity-driven beta rally.':'BTC走弱而半导体走强，不支持“广谱流动性牛市”的解释。');
  if((V('Currency','JPY','d5')??0)<-2) cross.push(isEn?'JPY appreciation is large enough to keep yen-funded carry-trade deleveraging on the risk radar.':'日元明显升值，日元融资套息交易去杠杆仍需纳入风险监测。');

  function driverSentence(d,p){
    if(!isEn){
      if(p==='liq')return d.liq<0?'主要约束来自流动性/金融条件收紧，而不是经济增长崩塌':'主要支撑来自流动性/金融条件改善';
      if(p==='growth')return d.growth<0?'主要约束来自市场隐含的增长/盈利预期走弱':'主要支撑来自增长与盈利韧性';
      if(p==='infl')return d.infl>0?'主要约束来自能源与再通胀压力':'主要支撑来自通胀压力缓和';
      return c==='stress'?'信用恶化已成为核心风险':'信用条件仍相对稳定';
    }
    if(p==='liq')return d.liq<0?'The main constraint is tighter liquidity/financial conditions, not collapsing growth':'The main support comes from easier liquidity/financial conditions';
    if(p==='growth')return d.growth<0?'The main constraint is softer market-implied growth/earnings':'The main support comes from resilient growth and earnings';
    if(p==='infl')return d.infl>0?'The main constraint is energy-led reflation':'The main support comes from easing inflation pressure';
    return c==='stress'?'Credit deterioration has become the core risk':'Credit remains comparatively stable';
  }

  const stText=!isEn
    ? `${driverSentence(d5,pST)}。过去5个交易日，10年美债 ${fmt(V('US Treasury','10y','d5'),0,'bp')}、HY利差 ${fmt(V('Credit Spread','US HY','d5'),0,'bp')}、Brent ${fmt(V('Commodity','Brent','d5'),1,'%')}、铜 ${fmt(V('Commodity','Copper','d5'),1,'%')}、标普500 ${fmt(V('Equity','S&P 500','d5'),1,'%')}、费城半导体 ${fmt(V('Equity','PHLX Semi','d5'),1,'%')}。${c==='healthy'?'信用仍稳，所以当前更像“估值/久期压力”，而不是“信用杀”。':'信用已不再完全稳定，需要提高基本面传导的权重。'}`
    : `${driverSentence(d5,pST)}. Over 5 trading days: US 10Y ${fmt(V('US Treasury','10y','d5'),0,'bp')}, HY spread ${fmt(V('Credit Spread','US HY','d5'),0,'bp')}, Brent ${fmt(V('Commodity','Brent','d5'),1,'%')}, copper ${fmt(V('Commodity','Copper','d5'),1,'%')}, S&P 500 ${fmt(V('Equity','S&P 500','d5'),1,'%')}, PHLX Semis ${fmt(V('Equity','PHLX Semi','d5'),1,'%')}. ${c==='healthy'?'Credit remains benign, so this is still more a valuation/duration shock than a credit event.':'Credit is no longer fully benign; fundamental transmission deserves more weight.'}`;

  const mtText=!isEn
    ? `${driverSentence(mtd,pMT)}。本月至今，10年美债 ${fmt(V('US Treasury','10y','mtd'),0,'bp')}、HY利差 ${fmt(V('Credit Spread','US HY','mtd'),0,'bp')}、Brent ${fmt(V('Commodity','Brent','mtd'),1,'%')}、美元指数 ${fmt(V('Currency','USD Index','mtd'),1,'%')}、VIX ${fmt(V('Equity','VIX','mtd'),1,'%')}。中期核心是“油价—长端利率—信用利差”是否形成共振；若 Brent 进入100–105美元以上、10年美债逼近/突破5%、HY向325bp以上走阔，风险性质将从贴现率冲击升级为基本面/信用冲击。`
    : `${driverSentence(mtd,pMT)}. MTD: US 10Y ${fmt(V('US Treasury','10y','mtd'),0,'bp')}, HY spread ${fmt(V('Credit Spread','US HY','mtd'),0,'bp')}, Brent ${fmt(V('Commodity','Brent','mtd'),1,'%')}, DXY ${fmt(V('Currency','USD Index','mtd'),1,'%')}, VIX ${fmt(V('Equity','VIX','mtd'),1,'%')}. The medium-term test is whether oil, long-end yields and credit reinforce one another. Brent above $100–105, US 10Y near/above 5%, and HY moving above ~325bp would mark a shift from discount-rate pressure to fundamental/credit tightening.`;

  const ltText=!isEn
    ? `${lt==='bull'?'长期偏乐观主要来自盈利与增长韧性，而不是流动性宽松':lt==='bear'?'长期偏谨慎主要来自高资本成本与再通胀约束':'长期是盈利韧性与高资本成本相互抵消，方向仍需确认'}。年初至今标普500 ${fmt(spy,1,'%')}、费城半导体 ${fmt(semiy,1,'%')}、铜 ${fmt(cuy,1,'%')}、BTC ${fmt(btcY,1,'%')}、HY利差 ${fmt(hyY,0,'bp')}；2年-10年曲线当前 ${latest('Curvature','2y10y',0,'bp')}。只要信用保持稳定，长期定价核心仍是 EPS/ROIC 能否覆盖更高的无风险利率与期限溢价。`
    : `${lt==='bull'?'The long-term constructive case is driven by earnings/growth resilience, not easy liquidity':lt==='bear'?'The long-term cautious case is driven by high capital costs and reflation':'Long-term direction is a balance between earnings resilience and a high cost of capital'}. YTD: S&P 500 ${fmt(spy,1,'%')}, PHLX Semis ${fmt(semiy,1,'%')}, copper ${fmt(cuy,1,'%')}, BTC ${fmt(btcY,1,'%')}, HY spread ${fmt(hyY,0,'bp')}; the 2Y-10Y curve is ${latest('Curvature','2y10y',0,'bp')}. As long as credit stays stable, the core question is whether EPS/ROIC can outrun the higher risk-free rate and term premium.`;

  const regime=!isEn
    ? `当前宏观状态：<strong>${labelState('liq',d5.liq)}</strong>的金融条件、<strong>${labelState('growth',d5.growth)}</strong>的增长/盈利信号、<strong>${labelState('infl',d5.infl)}</strong>的再通胀压力、信用<strong>${creditTxt}</strong>。短期${toneText(st)}，主要驱动是<strong>${primaryText(pST)}</strong>；这不是单纯的“经济衰退交易”。`
    : `Current macro regime: <strong>${labelState('liq',d5.liq)}</strong> financial conditions, <strong>${labelState('growth',d5.growth)}</strong> growth/earnings signals, <strong>${labelState('infl',d5.infl)}</strong> reflation pressure, and <strong>${creditTxt}</strong> credit. Near-term stance is ${toneText(st).toLowerCase()}, driven primarily by <strong>${primaryText(pST)}</strong>; this is not simply a recession trade.`;

  const analysis=document.getElementById('analysis');
  analysis.innerHTML=`
    <div class="analysis-title">${isEn?'Automated Macro Interpretation · Rates / Credit / Growth / Inflation':'自动宏观点评 · 利率 / 信用 / 增长 / 通胀'}</div>
    <div class="macro-regime">${regime}</div>
    <div class="macro-cards">${cards.map(x=>`<div class="macro-card"><small>${x[0]}</small><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('')}</div>
    ${cross.length?`<div class="macro-cross"><b>${isEn?'Cross-asset confirmation':'跨资产验证'}</b><br>${cross.map(x=>'• '+x).join('<br>')}</div>`:''}
    <div class="macro-row"><div class="macro-h">${isEn?'Short term (1–2 weeks)':'短期（1–2周）'}<span class="macro-tone">${toneText(st)}</span><span class="macro-primary">${primaryText(pST)}</span></div><div>${stText}</div></div>
    <div class="macro-row"><div class="macro-h">${isEn?'Medium term (1–3 months)':'中期（1–3个月）'}<span class="macro-tone">${toneText(mt)}</span><span class="macro-primary">${primaryText(pMT)}</span></div><div>${mtText}</div></div>
    <div class="macro-row"><div class="macro-h">${isEn?'Long term (6–12 months)':'长期（6–12个月）'}<span class="macro-tone">${toneText(lt)}</span><span class="macro-primary">${isEn?'Earnings vs. cost of capital':'盈利 vs. 资本成本'}</span></div><div>${ltText}</div></div>`;
  analysis.style.display='block';
}
'''

          for fp in ['index.html','public/index.html']:
              p=Path(fp)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              if '/* PROFESSIONAL_V3 */' not in s:
                  s=s.replace('</style>', css+'\n</style>',1)
              if 'id="rootLangSwitch"' not in s:
                  s=s.replace('<div class="sheet">','<div class="sheet">\n  <div id="rootLangSwitch" class="lang-switch"><a href="/zh">中文</a><span>|</span><a href="/en">EN</a></div>',1)
              if '// PROFESSIONAL_V3' not in s:
                  s=s.replace('(async()=>{try{', js+'\n(async()=>{try{',1)
              s=s.replace('renderInterpretation(data.rows);','renderProfessionalV3(data.rows);')
              p.write_text(s,encoding='utf-8')

          vercel={
            'rewrites':[
              {'source':'/zh','destination':'/index.html'},
              {'source':'/zh/','destination':'/index.html'},
              {'source':'/en','destination':'/index.html'},
              {'source':'/en/','destination':'/index.html'}
            ],
            'headers':[
              {'source':'/(.*)','headers':[{'key':'Cache-Control','value':'no-store, max-age=0'}]}
            ]
          }
          Path('vercel.json').write_text(json.dumps(vercel,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html public/index.html vercel.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: make professional macro interpretation the root dashboard'
          git push
