<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#202020;font-family:Arial,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif}.sheet{width:1220px;margin:18px auto 34px;padding:0 6px;position:relative}.title{font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;font-size:35px;font-weight:700;letter-spacing:.02em;margin:8px 0 44px}.lang{position:absolute;right:8px;top:4px;font-size:12px;border:1px solid #cfd6dc;border-radius:5px;padding:5px 8px;background:#fff}.lang a{color:#0877b7;text-decoration:none;font-weight:700}.lang b{color:#222}.date{font-weight:700;font-size:14px;margin:0 0 5px 12px}.columns{display:grid;grid-template-columns:574px 610px;column-gap:24px;align-items:start}.section{margin:0 0 7px}.section-name{font-size:16px;font-weight:700;line-height:20px;margin:0 0 1px 3px}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;line-height:1.15}col.c1{width:34%}col.cn{width:16.5%}thead th{height:27px;padding:4px 5px 3px;background:#0877b7;color:#fff;font-size:11.5px;font-weight:700;border-right:1px solid rgba(255,255,255,.35);white-space:nowrap;overflow:hidden}thead th:first-child{text-align:left}thead th:not(:first-child){text-align:right}tbody td{height:24px;padding:3px 7px;border-bottom:1px solid #d8d8d8;white-space:nowrap;overflow:hidden;text-overflow:clip}tbody tr:last-child td{border-bottom:2px solid #353535}tbody td:first-child{text-align:left}tbody td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}.latest{background:#fff}.p1{background:#e3f1e6}.p2{background:#b9dfc2}.p3{background:#70c68b}.n1{background:#fae7e8}.n2{background:#f7c4c7}.n3{background:#ef777f}.z{background:#f7f7f7}.na{color:#aaa}.source-link{color:inherit;text-decoration:none;border-bottom:1px dotted #9aa0a6}.source-link:hover{color:#0877b7;border-bottom-color:#0877b7}.source{font-size:11px;margin:6px 0 0 4px;color:#2f2f2f}.status{font-size:12px;color:#888;margin:8px 0 0 12px}.analysis{margin:28px 0 0 4px;border-top:2px solid #353535;padding-top:10px;display:none}.analysis-title{font-size:18px;font-weight:700;margin:0 0 10px}.regime{padding:10px 12px;background:#f5f8fa;border-left:4px solid #0877b7;font-size:13px;line-height:1.7;margin-bottom:10px}.regime strong{font-size:14px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.card{border:1px solid #d9dee3;padding:8px 9px;min-height:78px}.card small{display:block;color:#666;margin-bottom:3px}.card strong{display:block;font-size:14px;margin-bottom:4px}.card span{font-size:11px;color:#555;line-height:1.45}.cross{margin:6px 0 6px;padding:8px 10px;background:#fafafa;border:1px solid #e2e2e2;font-size:12px;line-height:1.65}.macro-row{display:grid;grid-template-columns:132px 1fr;gap:14px;padding:11px 0;border-bottom:1px solid #d8d8d8;font-size:13px;line-height:1.72}.macro-row:last-child{border-bottom:0}.horizon{font-weight:700}.tone{display:block;margin-top:2px}.primary{display:block;margin-top:3px;color:#666;font-size:11px;font-weight:400}@media(max-width:1260px){.sheet{transform-origin:top left;transform:scale(calc((100vw - 12px)/1220));margin-left:6px;margin-right:0}}@media print{.lang{display:none}.analysis{break-inside:avoid}.source-link{border-bottom:0}}
</style>

<script>
const isEn=location.pathname==='/en'||location.pathname.startsWith('/en/');
const T={
zh:{title:'1. 市场概览',loading:'正在更新市场数据…',source:'数据来源：FRED、Yahoo Finance、日本财务省｜北京时间每日早10点更新',analysisTitle:'自动宏观点评 · 机构跨资产框架',sourceTip:'点击打开原始数据源',groups:{'US Treasury':'美国国债','Curvature':'收益率曲线','Credit Spread':'信用利差','DM Rates':'发达市场利率','Commodity':'大宗商品','Equity':'股票','Currency':'外汇'},first:{'US Treasury':'期限','Curvature':'美债','Credit Spread':'','DM Rates':'','Commodity':'','Equity':'','Currency':''},headsRate:['最新 (%)','5日 (bps)','月初至今 (bps)','年初至今 (bps)'],headsBps:['最新 (bps)','5日 (bps)','月初至今 (bps)','年初至今 (bps)'],headsPct:['最新','5日 (%)','月初至今 %','年初至今 %'],tones:{bull:'偏乐观',neutral:'中性',bear:'偏谨慎'},names:{'3m':'3个月','1y':'1年','2y':'2年','5y':'5年','10y':'10年','30y':'30年','2y10y':'2年-10年','5y30y':'5年-30年','10y30y':'10年-30年','US IG':'美国投资级','US HY':'美国高收益','UK 10y':'英国10年','DE 10y':'德国10年','Italy 10y':'意大利10年','Japan 20y':'日本20年','Aussie 10y':'澳大利亚10年','Gold':'黄金','Silver':'白银','Copper':'铜','Brent':'布伦特原油','WTI':'WTI原油','N.Gas':'天然气','Dow Jones':'道琼斯','S&P 500':'标普500','NASDAQ':'纳斯达克','Russell 2k':'罗素2000','PHLX Semi':'费城半导体','VIX':'VIX','Euro Stox':'欧洲斯托克','UK':'英国','France':'法国','Germany':'德国','Swiss':'瑞士','Nikkei':'日经225','Hang Seng':'恒生指数','CSI 300':'沪深300','Taiwan':'台湾加权','Singapore':'新加坡','India':'印度','Australia':'澳大利亚','USD Index':'美元指数','EUR':'欧元','GBP':'英镑','CHF':'瑞郎','JPY':'日元','AUD':'澳元','HKD':'港元','THB':'泰铢','MYR':'马来西亚林吉特','INR':'印度卢比','IDR':'印尼盾','KRW':'韩元','CNH':'离岸人民币'}},
en:{title:'1. Market Overview',loading:'Updating market data…',source:'Source: FRED, Yahoo Finance, Ministry of Finance Japan | Updated daily at 10:00 Beijing Time (UTC+8)',analysisTitle:'Automated Macro Interpretation · Institutional Cross-Asset Framework',sourceTip:'Open original data source',groups:{'US Treasury':'US Treasury','Curvature':'Curvature','Credit Spread':'Credit Spread','DM Rates':'DM Rates','Commodity':'Commodity','Equity':'Equity','Currency':'Currency'},first:{'US Treasury':'Tenor','Curvature':'UST','Credit Spread':'','DM Rates':'','Commodity':'','Equity':'','Currency':''},headsRate:['Latest (%)','5Day (bps)','MTD (bps)','YTD (bps)'],headsBps:['Latest (bps)','5Day (bps)','MTD (bps)','YTD (bps)'],headsPct:['Latest','5Day (%)','MTD %','YTD %'],tones:{bull:'Constructive',neutral:'Neutral',bear:'Cautious'},names:{}}
};
const L=T[isEn?'en':'zh'];document.documentElement.lang=isEn?'en':'zh-CN';document.getElementById('title').textContent=L.title;document.getElementById('status').textContent=L.loading;document.getElementById('lang').innerHTML=isEn?'<a href="/zh">中文</a> &nbsp;|&nbsp; <b>EN</b>':'<b>中文</b> &nbsp;|&nbsp; <a href="/en">EN</a>';
function label(name){return isEn?name:(L.names[name]||name)}
function displayDate(){const d=new Date();return isEn?`${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`:`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`}
document.getElementById('date').textContent=displayDate();
function heat(v,unit){if(v==null||!Number.isFinite(v))return'';const a=Math.abs(v);if(a<.00001)return'z';let t1,t2;if(unit==='bps'){t1=5;t2=15}else{t1=.75;t2=3}if(v>0)return a>=t2?'p3':a>=t1?'p2':'p1';return a>=t2?'n3':a>=t1?'n2':'n1'}
function paren(v,d=1){if(v==null||!Number.isFinite(v))return'<span class="na">—</span>';const x=Math.abs(v)<.05?0:v;return x<0?`(${Math.abs(x).toFixed(d)})`:x.toFixed(d)}
function latest(r){if(r.latest==null||!Number.isFinite(r.latest))return'<span class="na">—</span>';const d=r.decimals??1;return Number(r.latest).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
function heads(group){if(group==='US Treasury'||group==='DM Rates')return L.headsRate;if(group==='Curvature'||group==='Credit Spread')return L.headsBps;return L.headsPct}
function sourceUrl(r){if(r.group==='Curvature'){const pairs={'2y10y':['DGS2','DGS10'],'5y30y':['DGS5','DGS30'],'10y30y':['DGS10','DGS30']};const p=pairs[r.name];if(p)return`https://fred.stlouisfed.org/graph/fredgraph.csv?id=${p[0]},${p[1]}`}if(r.group==='DM Rates'&&r.name==='Japan 20y')return'https://www.mof.go.jp/english/policy/jgbs/reference/interest_rate/historical/jgbcme_all.csv';if(r.id)return`https://fred.stlouisfed.org/series/${encodeURIComponent(r.id)}`;if(r.symbol)return`https://finance.yahoo.com/quote/${encodeURIComponent(r.symbol)}`;return null}
function sourceAnchor(r){const u=sourceUrl(r),txt=label(r.name);return u?`<a class="source-link" href="${u}" target="_blank" rel="noopener noreferrer" title="${L.sourceTip}">${txt}</a>`:txt}
function section(group,rows){const h=heads(group),unit=['US Treasury','Curvature','Credit Spread','DM Rates'].includes(group)?'bps':'pct';return`<div class="section"><div class="section-name">${L.groups[group]}</div><table><colgroup><col class="c1"><col class="cn"><col class="cn"><col class="cn"><col class="cn"></colgroup><thead><tr><th>${L.first[group]||''}</th><th>${h[0]}</th><th>${h[1]}</th><th>${h[2]}</th><th>${h[3]}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${sourceAnchor(r)}</td><td class="latest">${latest(r)}</td><td class="${heat(r.d5,unit)}">${paren(r.d5,unit==='bps'?0:1)}</td><td class="${heat(r.mtd,unit)}">${paren(r.mtd,unit==='bps'?0:1)}</td><td class="${heat(r.ytd,unit)}">${paren(r.ytd,unit==='bps'?0:1)}</td></tr>`).join('')}</tbody></table></div>`}
function build(rows,groups){return groups.map(g=>section(g,rows.filter(r=>r.group===g))).join('')}
function R(rows,g,n){return rows.find(r=>r.group===g&&r.name===n)||{}}
function V(rows,g,n,k){const x=R(rows,g,n)[k];return Number.isFinite(x)?x:null}
function sg(x,d=1,suffix=''){return Number.isFinite(x)?`${x>0?'+':''}${Number(x).toFixed(d)}${suffix}`:'—'}
function nm(x,d=0,suffix=''){return Number.isFinite(x)?`${Number(x).toFixed(d)}${suffix}`:'—'}
function clamp(x){return Math.max(-2,Math.min(2,x))}
function creditState(rows){const x=V(rows,'Credit Spread','US HY','latest');return x==null?'watch':x<300?'healthy':x<400?'watch':'stress'}
function drivers(rows,key){const y10=V(rows,'US Treasury','10y',key),hy=V(rows,'Credit Spread','US HY',key),usd=V(rows,'Currency','USD Index',key),vix=V(rows,'Equity','VIX',key),sp=V(rows,'Equity','S&P 500',key),rut=V(rows,'Equity','Russell 2k',key),semi=V(rows,'Equity','PHLX Semi',key),cu=V(rows,'Commodity','Copper',key),br=V(rows,'Commodity','Brent',key);let liquidity=0,growth=0,inflation=0;if(y10!=null)liquidity+=y10>=7?-1:y10>=3?-.5:y10<=-7?1:y10<=-3?.5:0;if(hy!=null)liquidity+=hy>=7?-1:hy>=3?-.5:hy<=-7?1:hy<=-3?.5:0;if(usd!=null)liquidity+=usd>=.75?-.6:usd<=-.75?.6:0;if(vix!=null)liquidity+=vix>=7?-.5:vix<=-7?.5:0;if(cu!=null)growth+=cu>=2?1:cu>=.7?.5:cu<=-2?-1:cu<=-.7?-.5:0;if(rut!=null)growth+=rut>=1?.6:rut<=-1?-.6:0;if(sp!=null)growth+=sp>=.7?.5:sp<=-.7?-.5:0;if(semi!=null)growth+=semi>=2?.7:semi<=-2?-.7:0;if(br!=null)inflation+=br>=7?1.5:br>=3?1:br<=-5?-.8:br<=-3?-.5:0;return{liquidity:clamp(liquidity),growth:clamp(growth),inflation:clamp(inflation)}}
function state(type,x){if(type==='liquidity')return x>=.7?'supportive':x<=-.7?'tight':'neutral';if(type==='growth')return x>=.7?'strong':x<=-.7?'soft':'neutral';return x>=.7?'hot':x<=-.5?'cool':'neutral'}
function stateText(type,s){if(isEn){const m={supportive:'Supportive',tight:'Tightening',neutral:'Neutral',strong:'Resilient',soft:'Soft',hot:'Reflationary',cool:'Contained',healthy:'Healthy',watch:'Watch',stress:'Stressed'};return m[s]}const m={supportive:'宽松/支持',tight:'收紧',neutral:'中性',strong:'韧性偏强',soft:'偏弱',hot:'再通胀偏热',cool:'温和',healthy:'健康',watch:'观察',stress:'承压'};return m[s]}
function view(rows,key){const d=drivers(rows,key),c=creditState(rows);const score=1.15*d.liquidity+.95*d.growth-.95*d.inflation-(c==='stress'?1.5:c==='watch'?.35:0);const w={liquidity:Math.abs(d.liquidity)*1.15,growth:Math.abs(d.growth)*.95,inflation:Math.abs(d.inflation)*.95,credit:c==='stress'?1.5:c==='watch'?.35:.15};const primary=Object.entries(w).sort((a,b)=>b[1]-a[1])[0][0];const tone=score>=1.05?'bull':score<=-1.05?'bear':'neutral';return{d,c,score,primary,tone}}
function primaryLabel(p){const zh={liquidity:'流动性/金融条件',growth:'增长/盈利',inflation:'通胀/商品',credit:'信用'};const en={liquidity:'Liquidity / Financial Conditions',growth:'Growth / Earnings',inflation:'Inflation / Commodities',credit:'Credit'};return(isEn?en:zh)[p]}
function primarySentence(rows,key){const x=view(rows,key);if(!isEn){if(x.primary==='liquidity')return x.d.liquidity<0?'主要约束来自流动性与金融条件收紧，而不是经济增长崩塌':'主要支撑来自流动性与金融条件改善';if(x.primary==='growth')return x.d.growth<0?'主要约束来自市场隐含的增长与盈利预期走弱':'主要支撑来自增长与盈利韧性';if(x.primary==='inflation')return x.d.inflation>0?'主要约束来自能源驱动的再通胀压力':'主要支撑来自通胀与商品压力缓和';return x.c==='stress'?'主要风险已转向信用收紧':'信用仍健康，系统性风险暂低'}if(x.primary==='liquidity')return x.d.liquidity<0?'The main constraint is tighter liquidity and financial conditions, not collapsing growth':'The main support comes from easier liquidity and financial conditions';if(x.primary==='growth')return x.d.growth<0?'The main constraint is softer market-implied growth and earnings momentum':'The main support comes from resilient growth and earnings';if(x.primary==='inflation')return x.d.inflation>0?'The main constraint is energy-led reflation':'The main support comes from easing inflation and commodity pressure';return x.c==='stress'?'Credit tightening has become the dominant risk':'Credit remains healthy, limiting systemic downside'}
function longTone(rows){let x=0;const spy=V(rows,'Equity','S&P 500','ytd'),semi=V(rows,'Equity','PHLX Semi','ytd'),cu=V(rows,'Commodity','Copper','ytd'),hy=V(rows,'Credit Spread','US HY','latest'),y10=V(rows,'US Treasury','10y','latest'),br=V(rows,'Commodity','Brent','ytd'),btc=V(rows,'Commodity','BTC','ytd');if(spy!=null)x+=spy>0?1:-1;if(semi!=null)x+=semi>20?.8:semi>0?.4:-.6;if(cu!=null)x+=cu>0?.5:-.5;if(hy!=null)x+=hy<300?.8:hy>=400?-1:0;if(y10!=null)x+=y10>=5?-.8:y10<4.4?.4:0;if(br!=null&&br>35)x-=.6;if(btc!=null)x+=btc>0?.3:-.3;return x>=1.5?'bull':x<=-.5?'bear':'neutral'}
function crossAsset(rows){const out=[],y10=V(rows,'US Treasury','10y','d5'),usd=V(rows,'Currency','USD Index','d5'),semi=V(rows,'Equity','PHLX Semi','d5'),sp=V(rows,'Equity','S&P 500','d5'),btc=V(rows,'Commodity','BTC','d5'),jpy=V(rows,'Currency','JPY','d5');if(y10!=null&&usd!=null&&y10>=3&&usd<=-.5)out.push(isEn?'Long-end yields are rising while the dollar is weakening: the move looks more like term-premium/fiscal/reflation pressure than a pure Fed-hawkish shock.':'长端利率上行而美元走弱：压力更偏期限溢价、财政供给与再通胀，而不是单纯“美联储更鹰”。');if(semi!=null&&sp!=null&&semi-sp>=1.5)out.push(isEn?'Semiconductors are materially outperforming the broad market, indicating concentrated earnings leadership rather than broad risk-on.':'半导体显著跑赢大盘，说明权益更依赖盈利确定性和集中度，而不是全面 Risk-on。');if(btc!=null&&semi!=null&&btc<0&&semi>1)out.push(isEn?'Bitcoin is lagging high-beta technology, arguing against a broad liquidity-driven risk-on regime.':'BTC落后于高贝塔科技，不支持“广谱流动性牛市”的解释。');if(jpy!=null&&jpy<=-2)out.push(isEn?'JPY appreciation is large enough to keep yen-funded carry-trade deleveraging on the risk radar.':'日元明显升值，全球套息交易去杠杆仍需纳入风险监测。');return out}
function renderAnalysis(rows){const st=view(rows,'d5'),mt=view(rows,'mtd'),lt=longTone(rows),c=creditState(rows),cross=crossAsset(rows),sd=st.d;document.getElementById('analysisTitle').textContent=L.analysisTitle;const regimeState=`${isEn?'Current mix':'当前组合'}：${isEn?'growth/earnings':'增长/盈利'} ${stateText('growth',state('growth',sd.growth))}，${isEn?'liquidity/financial conditions':'流动性/金融条件'} ${stateText('liquidity',state('liquidity',sd.liquidity))}，${isEn?'inflation/commodities':'通胀/商品'} ${stateText('inflation',state('inflation',sd.inflation))}，${isEn?'credit':'信用'} ${stateText('credit',c)}。`;const creditLine=c==='healthy'?(isEn?'Credit does not confirm systemic stress, so the pressure is still primarily valuation/duration rather than credit.':'信用尚未确认系统性风险，因此当前更像估值与久期压力，而不是信用杀。'):c==='watch'?(isEn?'Credit is in a watch zone; monitor transmission from financial conditions into fundamentals.':'信用进入观察区，需要确认金融条件是否向企业基本面传导。'):(isEn?'Credit is stressed, shifting the problem from valuation into fundamentals and financing.':'信用已明显承压，风险从估值问题升级为基本面与融资问题。');document.getElementById('regime').innerHTML=`<strong>${regimeState}</strong> ${isEn?'Near-term stance':'短期判断'}：${L.tones[st.tone]}。${primarySentence(rows,'d5')}。${creditLine}`;
const cards=[
[isEn?'Liquidity / Financial Conditions':'流动性 / 金融条件',stateText('liquidity',state('liquidity',sd.liquidity)),`${isEn?'US 10Y':'10年美债'} ${sg(V(rows,'US Treasury','10y','d5'),0,'bp')} · HY ${sg(V(rows,'Credit Spread','US HY','d5'),0,'bp')} · DXY ${sg(V(rows,'Currency','USD Index','d5'),1,'%')}`],
[isEn?'Growth / Earnings':'增长 / 盈利',stateText('growth',state('growth',sd.growth)),`${isEn?'Copper':'铜'} ${sg(V(rows,'Commodity','Copper','d5'),1,'%')} · ${isEn?'PHLX Semis':'费城半导体'} ${sg(V(rows,'Equity','PHLX Semi','d5'),1,'%')} · Russell ${sg(V(rows,'Equity','Russell 2k','d5'),1,'%')}`],
[isEn?'Inflation / Commodities':'通胀 / 商品',stateText('inflation',state('inflation',sd.inflation)),`Brent ${sg(V(rows,'Commodity','Brent','d5'),1,'%')} · WTI ${sg(V(rows,'Commodity','WTI','d5'),1,'%')}`],
