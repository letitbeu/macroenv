name: Apply UI v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ui-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch table widths and activate macro v2
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for fn in ['index.html','public/index.html']:
              p=Path(fn)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              s=s.replace('.sheet{width:1120px;margin:18px auto 30px;padding:0 4px;background:#fff}', '.sheet{width:1188px;margin:18px auto 30px;padding:0 4px;background:#fff}')
              s=s.replace('.columns{display:grid;grid-template-columns:510px 536px;column-gap:28px;align-items:start}', '.columns{display:grid;grid-template-columns:560px 600px;column-gap:28px;align-items:start}')
              s=s.replace('table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;line-height:1.15} col.c1{width:43%} col.cn{width:19%}', 'table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;line-height:1.15} col.c1{width:34%} col.cn{width:16.5%}')
              s=s.replace('thead th{height:26px;padding:4px 7px 3px;background:#0877b7;color:#fff;font-size:13px;font-weight:700;', 'thead th{height:26px;padding:4px 5px 3px;background:#0877b7;color:#fff;font-size:12px;font-weight:700;')
              s=s.replace('@media(max-width:1160px){.sheet{transform-origin:top left;transform:scale(calc((100vw - 12px)/1120));', '@media(max-width:1228px){.sheet{transform-origin:top left;transform:scale(calc((100vw - 12px)/1188));')
              p.write_text(s,encoding='utf-8')

          p=Path('public/page.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.wrap{width:1120px;margin:18px auto 30px;position:relative}', '.wrap{width:1188px;margin:18px auto 30px;position:relative}')
          s=s.replace('.frame{display:block;width:1120px;border:0;overflow:hidden}', '.frame{display:block;width:1188px;border:0;overflow:hidden}')
          s=s.replace('@media(max-width:1160px){.wrap{transform-origin:top left;transform:scale(calc((100vw - 12px)/1120));', '@media(max-width:1228px){.wrap{transform-origin:top left;transform:scale(calc((100vw - 12px)/1188));')
          import re
          s=re.sub(r'<script src="/professional[^\"]*\.js[^\"]*"></script>', '<script src="/professional-v2.js?v=20260909-1105"></script>', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html public/index.html public/page.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: widen bps columns and activate institutional macro v2'
          git push
