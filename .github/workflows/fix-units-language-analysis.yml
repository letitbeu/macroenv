name: Fix units language and analysis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-units-language-analysis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Explicit units on all rate/spread change columns.
          for fn in ['index.html','public/index.html']:
              p=Path(fn)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=s.replace("headsRate:['最新 (%)','5日','月初至今','年初至今']", "headsRate:['最新 (%)','5日 (bps)','月初至今 (bps)','年初至今 (bps)']")
              s=s.replace("headsBps:['最新 (bps)','5日','月初至今','年初至今']", "headsBps:['最新 (bps)','5日 (bps)','月初至今 (bps)','年初至今 (bps)']")
              s=s.replace("headsRate:['Latest (%)','5Day','MTD','YTD']", "headsRate:['Latest (%)','5Day (bps)','MTD (bps)','YTD (bps)']")
              s=s.replace("headsBps:['Latest (bps)','5Day','MTD','YTD']", "headsBps:['Latest (bps)','5Day (bps)','MTD (bps)','YTD (bps)']")
              p.write_text(s,encoding='utf-8')

          # 2) Make language switch prominent and bust cached professional analysis JS.
          p=Path('public/page.html')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=s.replace(".lang{position:absolute;right:4px;top:11px;z-index:3;font-size:12px;color:#777}.lang a{color:#777;text-decoration:none}.lang a:hover{color:#0877b7}.lang b{color:#202020}",
                          ".lang{position:absolute;right:4px;top:8px;z-index:10;font-size:13px;color:#555;background:#fff;border:1px solid #cfd6dc;border-radius:5px;padding:5px 9px;box-shadow:0 1px 3px rgba(0,0,0,.06)}.lang a{color:#0877b7;text-decoration:none;font-weight:700}.lang a:hover{text-decoration:underline}.lang b{color:#202020}")
              # Force clients to load the upgraded macro commentary engine rather than a cached old copy.
              import re
              s=re.sub(r'<script src="/professional\.js(?:\?v=[^"]*)?"></script>', '<script src="/professional.js?v=20260909-1052"></script>', s)
              p.write_text(s,encoding='utf-8')

          # 3) Add a version marker to professional analysis so cached old output is clearly displaced.
          p=Path('public/professional.js')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              # Keep the professional framework already in place; only make the title explicit.
              s=s.replace("title:'Automated Macro Interpretation'", "title:'Automated Macro Interpretation · Rates / Credit / Growth / Inflation'")
              s=s.replace("title:'自动宏观点评'", "title:'自动宏观点评 · 利率 / 信用 / 增长 / 通胀'")
              p.write_text(s,encoding='utf-8')

          # 4) Prevent stale JS/data on the daily dashboard.
          p=Path('vercel.json')
          if p.exists():
              import json
              cfg=json.loads(p.read_text(encoding='utf-8'))
              cfg['headers']=[
                {'source':'/professional.js','headers':[{'key':'Cache-Control','value':'no-store, max-age=0'}]},
                {'source':'/data/(.*)','headers':[{'key':'Cache-Control','value':'no-store, max-age=0'}]}
              ]
              p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html public/index.html public/page.html public/professional.js vercel.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: label bps units, expose language switch, refresh macro analysis'
          git push
