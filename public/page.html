<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Market Overview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#202020;font-family:Arial,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:1120px;margin:18px auto 30px;position:relative}.lang{position:absolute;right:4px;top:11px;z-index:3;font-size:12px;color:#777}.lang a{color:#777;text-decoration:none}.lang a:hover{color:#0877b7}.lang b{color:#202020}.frame{display:block;width:1120px;border:0;overflow:hidden}.analysis{margin:12px 4px 0;border-top:2px solid #353535;padding-top:10px}.analysis h2{font-size:18px;margin:0 0 8px}.regime{padding:8px 10px;border-left:4px solid #0877b7;background:#f5f8fa;font-size:13px;line-height:1.65;margin-bottom:8px}.drivers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.driver{border:1px solid #d9dee3;padding:8px 9px;min-height:72px}.driver small{display:block;color:#666;margin-bottom:3px}.driver strong{display:block;font-size:14px;margin-bottom:3px}.driver span{font-size:11px;color:#555;line-height:1.45}.row{display:grid;grid-template-columns:112px 1fr;gap:14px;padding:11px 0;border-bottom:1px solid #d8d8d8;font-size:13px;line-height:1.7}.row:last-child{border-bottom:0}.h{font-weight:700}.tag{font-size:11px;color:#666;font-weight:400}@media(max-width:1160px){.wrap{transform-origin:top left;transform:scale(calc((100vw - 12px)/1120));margin-left:6px;margin-right:0}}@media print{.lang{display:none}.analysis{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <div id="lang" class="lang"></div>
  <iframe id="marketFrame" class="frame" scrolling="no"></iframe>
  <section id="analysis" class="analysis" style="display:none">
    <h2 id="analysisTitle"></h2>
    <div id="regime" class="regime"></div>
    <div id="drivers" class="drivers"></div>
    <div id="rows"></div>
  </section>
</div>
<script src="/professional.js"></script>
</body>
</html>
